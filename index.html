<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FS25 Challenge Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eee0;--panel:#fbfcf7;--ink:#1d2a1f;--mute:#5d6b5e;--line:#cdd6c0;--field:#2f6b3a;--gold:#d9a82b;--soil:#3b2a1c;--danger:#a63d2f}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Barlow,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--soil);color:#f2ead8;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:6px solid var(--gold)}
header h1{font:700 28px 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.5px;flex:1}
main{max-width:1000px;margin:0 auto;padding:20px;display:grid;grid-template-columns:240px 1fr;gap:20px}
@media(max-width:760px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
h2{font:700 22px 'Barlow Condensed',sans-serif;margin:0 0 10px}
h3{font:600 18px 'Barlow Condensed',sans-serif;margin:18px 0 8px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input,select{width:100%}
button{cursor:pointer;background:var(--field);color:#fff;border-color:var(--field);font-weight:600}
button.sec{background:#fff;color:var(--ink);border-color:var(--line)}
button.del{background:#fff;color:var(--danger);border-color:var(--line);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}.row>button{flex:0 0 auto}
.maplist button{display:block;width:100%;text-align:left;margin-bottom:6px;background:#fff;color:var(--ink);border-color:var(--line)}
.maplist button.on{background:var(--field);color:#fff;border-color:var(--field)}
.total{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.total b{font:700 56px/1 'Barlow Condensed',sans-serif;color:var(--field)}
.bar{height:14px;background:#dfe6d2;border-radius:7px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--field);transition:width .3s}
.bar i.done{background:var(--gold)}
.crop{border-top:1px solid var(--line);padding:12px 0}
.crop .top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.crop .name{font-weight:600}
.tag{font-size:12px;background:var(--gold);color:var(--soil);border-radius:3px;padding:1px 6px;margin-left:6px;font-weight:600}
.mute{color:var(--mute);font-size:14px}
.log div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:14px}
#status{font-size:13px;opacity:.85}
.hide{display:none}
</style>
</head>
<body>
<header>
  <h1>FS25 Challenge Tracker</h1>
  <span id="status">Offline modus (lokale opslag)</span>
  <button id="btnLogin" class="sec">Inloggen met Google</button>
  <button id="btnLogout" class="sec hide">Uitloggen</button>
</header>
<main>
  <aside class="panel">
    <h2>Maps</h2>
    <div id="maps" class="maplist"></div>
    <div class="row"><input id="newMap" placeholder="Naam van nieuwe map" aria-label="Naam nieuwe map"></div>
    <div class="row"><button id="addMap">Map aanmaken</button></div>
  </aside>
  <section id="content" class="panel"></section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAf1oTkvYAgrF6fxjM2HjeRFApoWjBI1qo",
  authDomain: "farming-product-verkoop.firebaseapp.com",
  projectId: "farming-product-verkoop",
  storageBucket: "farming-product-verkoop.firebasestorage.app",
  messagingSenderId: "877325650826",
  appId: "1:877325650826:web:8474dd62d5168db2b89673",
  measurementId: "G-PZZEDLMC4X"
};

/* ===== 2. Standaardgewassen FS25 (aanpasbaar; controleer tegen je eigen spel) ===== */
const BASE_CROPS = ["Tarwe","Gerst","Haver","Koolzaad","Mais","Zonnebloemen","Sojabonen","Aardappelen","Suikerbieten","Suikerriet","Katoen","Rijst (langkorrelig)","Sorghum","Erwten","Groene bonen","Spinazie","Wortelen","Pastinaak","Rode bieten","Druiven","Olijven","Gras","Hooi","Kuilgras","Stro"];

/* ===== 3. Staat ===== */
const KEY = "fs25-challenge-v1";
let state = JSON.parse(localStorage.getItem(KEY) || "null") || { maps: [], customCrops: [], active: null };
let user = null, db = null, saveTimer = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = n => Math.round(n).toLocaleString("nl-NL");
const activeMap = () => state.maps.find(m => m.id === state.active);
const soldOf = (m, c) => m.sales.filter(s => s.crop === c.id).reduce((a, s) => a + s.l, 0);

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
  if (user && db) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => db.collection("users").doc(user.uid).set(state)
      .catch(e => setStatus("Opslaan mislukt: " + e.message)), 400);
  }
}
function setStatus(t) { $("status").textContent = t; }

/* ===== 4. Firebase login ===== */
const configured = !FIREBASE_CONFIG.apiKey.startsWith("VUL_IN");
if (configured) {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  firebase.auth().onAuthStateChanged(async u => {
    user = u;
    $("btnLogin").classList.toggle("hide", !!u);
    $("btnLogout").classList.toggle("hide", !u);
    if (u) {
      setStatus("Ingelogd als " + (u.displayName || u.email) + " (gesynchroniseerd)");
      try {
        const snap = await db.collection("users").doc(u.uid).get();
        if (snap.exists) state = snap.data(); else save();
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch (e) { setStatus("Laden mislukt: " + e.message); }
    } else setStatus("Offline modus (lokale opslag)");
    render();
  });
}
$("btnLogin").onclick = () => {
  if (!configured) return alert("Vul eerst je Firebase-configuratie in bovenaan het script (FIREBASE_CONFIG).");
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert("Inloggen mislukt: " + e.message));
};
$("btnLogout").onclick = () => firebase.auth().signOut();

/* ===== 5. Acties ===== */
$("addMap").onclick = () => {
  const name = $("newMap").value.trim();
  if (!name) return;
  const m = { id: uid(), name, crops: [], sales: [] };
  state.maps.push(m); state.active = m.id; $("newMap").value = ""; save(); render();
};
function addCrop() {
  const m = activeMap(), sel = $("cropSel").value, custom = $("cropCustom").value.trim();
  const goal = parseFloat($("cropGoal").value);
  const name = custom || sel;
  if (!name || !(goal > 0)) return alert("Kies of typ een gewas en geef een doel in liters (groter dan 0).");
  if (m.crops.some(c => c.name.toLowerCase() === name.toLowerCase())) return alert("Dit gewas staat al in deze map.");
  const isMod = !!custom && !BASE_CROPS.includes(custom);
  if (isMod && !state.customCrops.includes(custom)) state.customCrops.push(custom);
  m.crops.push({ id: uid(), name, goal, mod: isMod || state.customCrops.includes(name) });
  save(); render();
}
function addSale(cropId) {
  const m = activeMap(), v = parseFloat($("sale-" + cropId).value);
  if (!(v > 0)) return;
  m.sales.push({ id: uid(), crop: cropId, l: v, t: Date.now() });
  save(); render();
}
function delSale(id) { const m = activeMap(); m.sales = m.sales.filter(s => s.id !== id); save(); render(); }
function editGoal(cropId) {
  const c = activeMap().crops.find(c => c.id === cropId);
  const v = parseFloat(prompt("Nieuw doel in liters voor " + c.name + ":", c.goal));
  if (v > 0) { c.goal = v; save(); render(); }
}
function delCrop(cropId) {
  if (!confirm("Gewas en bijbehorende verkopen verwijderen?")) return;
  const m = activeMap();
  m.crops = m.crops.filter(c => c.id !== cropId); m.sales = m.sales.filter(s => s.crop !== cropId);
  save(); render();
}
function delMap() {
  const m = activeMap();
  if (!confirm("Map '" + m.name + "' volledig verwijderen?")) return;
  state.maps = state.maps.filter(x => x.id !== m.id); state.active = state.maps[0]?.id || null; save(); render();
}

/* ===== 6. Weergave ===== */
function render() {
  $("maps").innerHTML = state.maps.map(m =>
    `<button class="${m.id === state.active ? "on" : ""}" data-map="${m.id}">${esc(m.name)}</button>`).join("")
    || '<p class="mute">Nog geen maps.</p>';
  document.querySelectorAll("[data-map]").forEach(b => b.onclick = () => { state.active = b.dataset.map; save(); render(); });

  const m = activeMap(), box = $("content");
  if (!m) { box.innerHTML = "<h2>Welkom</h2><p>Maak links een map aan om je challenge te starten.</p>"; return; }

  let goalSum = 0, soldSum = 0;
  m.crops.forEach(c => { goalSum += c.goal; soldSum += Math.min(soldOf(m, c), c.goal); });
  const pct = goalSum ? soldSum / goalSum * 100 : 0;

  const options = [...BASE_CROPS, ...state.customCrops.filter(x => !BASE_CROPS.includes(x))]
    .map(n => `<option>${esc(n)}</option>`).join("");

  box.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2 style="margin:0">${esc(m.name)}</h2><button class="del" id="dm">Map verwijderen</button>
    </div>
    <div class="total"><b>${pct.toFixed(1)}%</b><span class="mute">totaal voltooid · ${fmt(soldSum)} van ${fmt(goalSum)} liter</span></div>
    <div class="bar"><i class="${pct >= 100 ? "done" : ""}" style="width:${Math.min(pct, 100)}%"></i></div>

    <h3>Gewas toevoegen aan challenge</h3>
    <div class="row">
      <select id="cropSel" aria-label="Gewas">${options}</select>
      <input id="cropCustom" placeholder="Of: eigen/mod-gewas of product" aria-label="Eigen gewas">
      <input id="cropGoal" type="number" min="1" placeholder="Doel (liter)" aria-label="Doel in liter">
      <button id="ac">Toevoegen</button>
    </div>
    <p class="mute">Mod-gewassen en producten typ je in het tekstveld; ze worden bewaard en verschijnen daarna in de lijst.</p>

    <h3>Voortgang per gewas</h3>
    ${m.crops.map(c => {
      const s = soldOf(m, c), p = Math.min(s / c.goal * 100, 100);
      const log = m.sales.filter(x => x.crop === c.id).slice(-5).reverse();
      return `<div class="crop">
        <div class="top"><span class="name">${esc(c.name)}${c.mod ? '<span class="tag">mod</span>' : ""}</span>
          <span>${fmt(s)} / ${fmt(c.goal)} L · <b>${p.toFixed(1)}%</b></span></div>
        <div class="bar"><i class="${p >= 100 ? "done" : ""}" style="width:${p}%"></i></div>
        <div class="row">
          <input id="sale-${c.id}" type="number" min="1" placeholder="Verkocht (liter)" aria-label="Verkocht liter ${esc(c.name)}">
          <button data-sale="${c.id}">Verkoop registreren</button>
          <button class="sec" data-goal="${c.id}">Doel wijzigen</button>
          <button class="del" data-delcrop="${c.id}">Verwijderen</button>
        </div>
        <div class="log">${log.map(x => `<div><span>${new Date(x.t).toLocaleDateString("nl-NL")} · ${fmt(x.l)} L</span><button class="del" data-delsale="${x.id}">Ongedaan</button></div>`).join("")}</div>
      </div>`;
    }).join("") || '<p class="mute">Voeg hierboven je eerste gewas toe.</p>'}`;

  $("dm").onclick = delMap; $("ac").onclick = addCrop;
  box.querySelectorAll("[data-sale]").forEach(b => b.onclick = () => addSale(b.dataset.sale));
  box.querySelectorAll("[data-goal]").forEach(b => b.onclick = () => editGoal(b.dataset.goal));
  box.querySelectorAll("[data-delcrop]").forEach(b => b.onclick = () => delCrop(b.dataset.delcrop));
  box.querySelectorAll("[data-delsale]").forEach(b => b.onclick = () => delSale(b.dataset.delsale));
}
render();
</script>
</body>
</html>
