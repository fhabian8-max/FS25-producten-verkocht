<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FS25 Complete Tracker Pro</title>

  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-green-hover: #16a34a;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 50px;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand i {
      color: var(--accent-green);
      font-size: 1.8rem;
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .user-panel {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .auth-btn {
      background: var(--accent-green);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .auth-btn:hover {
      background: var(--accent-green-hover);
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* Controls Header */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-bar {
      width: 100%;
      position: relative;
    }

    .search-bar input {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.8rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
    }

    .search-bar i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .category-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent-green);
      color: #000;
      font-weight: 600;
      border-color: var(--accent-green);
    }

    /* Stats Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .item-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .item-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .badge-base { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .badge-dlc { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .badge-mod { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

    .card-inputs {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .input-group input {
      width: 120px;
      padding: 0.4rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      text-align: right;
    }

    .sync-status {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sync-active { color: var(--accent-green); }

    /* Custom Trees Section */
    .special-section {
      background: #111827;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .special-section h2 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-green);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-tractor"></i>
      <h1>FS25 Complete Tracker Pro</h1>
    </div>
    <div class="user-panel">
      <span id="sync-indicator" class="sync-status">
        <i class="fa-solid fa-hard-drive"></i> Lokaal opgeslagen
      </span>
      <button id="auth-btn" class="auth-btn" onclick="toggleAuth()">
        <i class="fa-brands fa-google"></i> Inloggen met Google
      </button>
    </div>
  </header>

  <div class="container">
    
    <!-- Special Forestry Tracker -->
    <div class="special-section">
      <h2><i class="fa-solid fa-tree"></i> Bosbouw Tracker (Bomen Geplant)</h2>
      <div class="input-group" style="max-width: 300px;">
        <label for="trees-planted">Totaal geplante bomen:</label>
        <input type="number" id="trees-planted" value="0" min="0" onchange="updateTrees(this.value)">
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Zoek op gewas, product, mod of type..." oninput="filterData()">
      </div>
      <div class="category-tabs" id="category-tabs">
        <button class="cat-btn active" onclick="setCategory('all')">Alles</button>
        <button class="cat-btn" onclick="setCategory('Base Gewassen')">Base Gewassen</button>
        <button class="cat-btn" onclick="setCategory('DLC Gewassen')">DLC Gewassen</button>
        <button class="cat-btn" onclick="setCategory('Base Producten')">Base Producten</button>
        <button class="cat-btn" onclick="setCategory('DLC Producten')">DLC Producten</button>
        <button class="cat-btn" onclick="setCategory('Mod Gewassen')">Mod Gewassen</button>
        <button class="cat-btn" onclick="setCategory('Mod Producten')">Mod Producten</button>
      </div>
    </div>

    <!-- Data Grid -->
    <div class="grid" id="data-grid"></div>

  </div>

    // Status State
    let userState = {
      trees: 0,
      items: {}

    let currentUser = null;
    let currentCategory = 'all';

    // Firebase Config Placeholder (Gebruikt standaard een veilige offline fallback als dit niet is ingevuld)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    let db = null;
    let auth = null;

    // Initialize App & Firebase
    function initApp() {
      try {
        if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "YOUR_API_KEY") {
          firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          auth = firebase.auth();

          auth.onAuthStateChanged(user => {
            if (user) {
              currentUser = user;
              document.getElementById('auth-btn').innerHTML = `<i class="fa-solid fa-right-from-bracket"></i> Uitloggen (${user.displayName || 'Gebruiker'})`;
              document.getElementById('sync-indicator').innerHTML = `<i class="fa-solid fa-cloud sync-active"></i> Cloud Synced (Firebase)`;
              loadCloudData();
            } else {
              currentUser = null;
              document.getElementById('auth-btn').innerHTML = `<i class="fa-brands fa-google"></i> Inloggen met Google`;
              document.getElementById('sync-indicator').innerHTML = `<i class="fa-solid fa-hard-drive"></i> Lokaal opgeslagen`;
              loadLocalData();
            }
          });
        } else {
          loadLocalData();
        }
      } catch (e) {
        console.warn("Firebase niet geconfigureerd of geladen, overschakelen op localStorage:", e);
        loadLocalData();
      }

      renderGrid();
    }

    // Load Local Data
    function loadLocalData() {
      const localData = localStorage.getItem('fs25_tracker_data');
      if (localData) {
        userState = JSON.parse(localData);
      }
      applyStateToUI();
    }

    // Load Cloud Data
    function loadCloudData() {
      if (!db || !currentUser) return;

      db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
        if (doc.exists) {
          userState = doc.data();
          applyStateToUI();
        }
      });
    }

    // Save Data
    function saveData() {
      // Local Save
      localStorage.setItem('fs25_tracker_data', JSON.stringify(userState));

      // Cloud Save if Logged In
      if (db && currentUser) {
        db.collection('users').doc(currentUser.uid).set(userState, { merge: true });
      }
    }

    // Apply Loaded State
    function applyStateToUI() {
      document.getElementById('trees-planted').value = userState.trees || 0;
      
      itemsData.forEach(item => {
        const itemState = userState.items[item.id] || { count: 0, target: 0 };
        const countInput = document.getElementById(`count-${item.id}`);
        const targetInput = document.getElementById(`target-${item.id}`);

        if (countInput) countInput.value = itemState.count || 0;
        if (targetInput) targetInput.value = itemState.target || 0;
      });
    }

    // Render Items
    function renderGrid() {
      const grid = document.getElementById('data-grid');
      grid.innerHTML = '';

      itemsData.forEach(item => {
        const itemState = userState.items[item.id] || { count: 0, target: 0 };

        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.cat = item.cat;
        card.dataset.name = item.name.toLowerCase();

        card.innerHTML = `
          <div class="card-header">
            <span class="item-title">${item.name}</span>
            <span class="item-badge badge-${item.badge}">${item.cat.split(' ')[0]}</span>
          </div>
          <div class="card-inputs">
            <div class="input-group">
              <label>Aantal / Voorraad:</label>
              <input type="number" id="count-${item.id}" value="${itemState.count || 0}" min="0" onchange="updateItem('${item.id}', 'count', this.value)">
            </div>
            <div class="input-group">
              <label>Doelstelling:</label>
              <input type="number" id="target-${item.id}" value="${itemState.target || 0}" min="0" onchange="updateItem('${item.id}', 'target', this.value)">
            </div>
          </div>
        `;

        grid.appendChild(card);
      });

      filterData();
    }

    // Update Single Item Value
    function updateItem(id, field, value) {
      if (!userState.items[id]) {
        userState.items[id] = { count: 0, target: 0 };
      }
      userState.items[id][field] = parseInt(value) || 0;
      saveData();
    }

    // Update Trees Value
    function updateTrees(val) {
      userState.trees = parseInt(val) || 0;
      saveData();
    }

    // Filter Items by Category & Search
    function filterData() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const matchesCategory = currentCategory === 'all' || card.dataset.cat === currentCategory;
        const matchesSearch = card.dataset.name.includes(query);

        if (matchesCategory && matchesSearch) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      filterData();
    }

    // Auth Handler
    function toggleAuth() {
      if (!auth) {
        alert("Firebase is niet geconfigureerd. Zorg dat je een werkende Firebase API Sleutel toevoegt in de code om Google Login te gebruiken.");
        return;
      }

      if (currentUser) {
        auth.signOut();
      } else {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => {
          alert("Inloggen mislukt: " + err.message);
        });
      }
    }

    // Start App
    window.onload = initApp;
  </script>
</body>
</html>
